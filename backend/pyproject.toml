[project]
name = "ai-energy-backend"
version = "0.1.0"
description = "AI Energy Management Platform - backend (FastAPI + LangGraph + Jev)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.6",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.12",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
